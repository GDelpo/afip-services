[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afip-services"
version = "0.1.0"
description = "Python client for AFIP/ARCA SOAP web services (WSAA authentication + WSN padron/inscription queries)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Guido Delponte", email = "guido_delponte@hotmail.com" },
]
keywords = ["afip", "arca", "wsaa", "wsn", "soap", "argentina", "seguros"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "zeep>=4.1.0",
    "xmltodict>=0.12.0",
    "cryptography>=40.0.0",
    "python-dotenv>=0.21.0",
]

[project.optional-dependencies]
logtail = ["logtail-python>=0.2.0"]

[project.urls]
Homepage = "https://github.com/GDelpo/afip-services"
Repository = "https://github.com/GDelpo/afip-services"
Issues = "https://github.com/GDelpo/afip-services/issues"

[tool.setuptools.packages.find]
include = ["afip_services*"]
exclude = ["tests*"]
