# Catalog of AFIP web services.
#
# Ships with the padron family (inscripción + padrón A13). To add a new
# service of the same family, copy an entry and change the URLs + names.
# For AFIP services with a different shape (wsfe, wsmtx, wsfexv1, etc.)
# declare a new `kind` and register a handler — see afip_services/registry.py.
#
# Override the default catalog by setting AFIP_SERVICES_CATALOG to a YAML
# path, or by calling afip_services.load_catalog(path) at runtime.

services:

  WS_SR_CONSTANCIA_INSCRIPCION:
    testing_service_url: https://awshomo.afip.gov.ar/sr-padron/webservices/personaServiceA5
    testing_wsdl_url: https://awshomo.afip.gov.ar/sr-padron/webservices/personaServiceA5?WSDL
    production_service_url: https://aws.afip.gov.ar/sr-padron/webservices/personaServiceA5
    production_wsdl_url: https://aws.afip.gov.ar/sr-padron/webservices/personaServiceA5?WSDL
    service_name: ws_sr_constancia_inscripcion
    method_name: getPersonaList_v2
    kind: padron_list
    slug: inscription
    description: AFIP Constancia de Inscripción (bulk query — multiple CUITs per call)

  WS_SR_PADRON_A13:
    testing_service_url: https://awshomo.afip.gov.ar/sr-padron/webservices/personaServiceA13
    testing_wsdl_url: https://awshomo.afip.gov.ar/sr-padron/webservices/personaServiceA13?WSDL
    production_service_url: https://aws.afip.gov.ar/sr-padron/webservices/personaServiceA13
    production_wsdl_url: https://aws.afip.gov.ar/sr-padron/webservices/personaServiceA13?WSDL
    service_name: ws_sr_padron_a13
    method_name: getPersona
    kind: padron_single
    slug: padron
    description: AFIP Padrón A13 (single query — one CUIT per call, loops internally)

